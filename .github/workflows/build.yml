name: Build driver

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore WDK and SDK (NuGet)
        run: nuget restore .\packages.config -PackagesDirectory .\packages\

      - name: Build, sign and package
        shell: pwsh
        run: .\ci\build.ps1 -Configuration Release

      - name: Upload TouchpadFix package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TouchpadFix
          path: out/TouchpadFix
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-logs
          path: out/logs

      # Also publish the package and logs to the 'dist' branch, so they can be
      # fetched with plain git (and downloaded from the repo page as a zip).
      - name: Publish to the dist branch
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'dist'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          if (Test-Path out) { Copy-Item -Path out\* -Destination $stage -Recurse -Force }
          "source commit: $env:GITHUB_SHA`nrun: $env:GITHUB_RUN_ID`nresult: $env:JOB_STATUS" | Out-File (Join-Path $stage 'BUILD_INFO.txt') -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dist-staging
          git rm -r -q --cached .
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' } | Remove-Item -Recurse -Force
          Copy-Item -Path "$stage\*" -Destination . -Recurse -Force
          git add -A
          git commit -q -m "Build output for $env:GITHUB_SHA"
          git push -f origin HEAD:dist
        env:
          JOB_STATUS: ${{ job.status }}
